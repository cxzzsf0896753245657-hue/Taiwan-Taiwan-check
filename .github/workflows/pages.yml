name: 部署網站（GitHub Pages）

# Publishes site/ to the gh-pages branch, which GitHub Pages serves.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 檢查資料格式
        run: python3 -c "import json;d=json.load(open('site/data/entries.json'));assert isinstance(d,list) and d;print(len(d),'entries')"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 部署網站
